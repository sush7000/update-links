<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }
    h2 {
      margin-bottom: 10px;
    }
    input, textarea {
      width: 100%;
      max-width: 500px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-right: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #addBtn {
      background-color: #4CAF50;
      color: white;
    }
    .msg {
      margin-top: 10px;
      color: green;
    }
    .link-item {
      background: #fff;
      padding: 10px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }
    .link-actions {
      margin-top: 5px;
    }
    .edit-btn, .delete-btn, .up-btn, .down-btn {
      background-color: #2196F3;
      color: white;
    }
    .delete-btn {
      background-color: #f44336;
    }
    .up-btn, .down-btn {
      background-color: #9C27B0;
    }
  </style>
</head>
<body>
  <h2>Add New Post Link</h2>
  <input type="text" id="title" placeholder="Title (e.g. Post #1)" />
  <textarea id="link" placeholder="Paste your full URL here..."></textarea>
  <button id="addBtn" onclick="addPost()">Add Link</button>
  <p class="msg" id="msg"></p>  <h2>All Posts</h2>
  <div id="posts"></div>  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDeh2YAbTvupfNhEbT1uDBvoNiW1KQU9-o",
      authDomain: "trending-viral-links.firebaseapp.com",
      databaseURL: "https://trending-viral-links-default-rtdb.firebaseio.com",
      projectId: "trending-viral-links",
      storageBucket: "trending-viral-links.appspot.com",
      messagingSenderId: "803173160374",
      appId: "1:803173160374:web:fc0bb2ab64564f59ee9d17"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const postsDiv = document.getElementById('posts');
    const msg = document.getElementById('msg');

    function renderPosts(data) {
      postsDiv.innerHTML = '';
      Object.keys(data).forEach((key, index) => {
        const post = data[key];
        const div = document.createElement('div');
        div.className = 'link-item';

        const input = document.createElement('input');
        input.value = post.text;
        input.style.marginBottom = '5px';

        const textarea = document.createElement('textarea');
        textarea.value = post.link;

        const actions = document.createElement('div');
        actions.className = 'link-actions';

        const saveBtn = document.createElement('button');
        saveBtn.textContent = 'Save';
        saveBtn.className = 'edit-btn';
        saveBtn.onclick = () => {
          db.ref('posts/' + key).set({ text: input.value, link: textarea.value });
        };

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.className = 'delete-btn';
        deleteBtn.onclick = () => {
          db.ref('posts/' + key).remove();
        };

        const upBtn = document.createElement('button');
        upBtn.textContent = '↑';
        upBtn.className = 'up-btn';
        upBtn.onclick = () => reorderPosts(key, -1);

        const downBtn = document.createElement('button');
        downBtn.textContent = '↓';
        downBtn.className = 'down-btn';
        downBtn.onclick = () => reorderPosts(key, 1);

        actions.append(saveBtn, deleteBtn, upBtn, downBtn);
        div.append(input, textarea, actions);
        postsDiv.appendChild(div);
      });
    }

    function reorderPosts(key, direction) {
      db.ref('posts').once('value').then(snapshot => {
        const data = snapshot.val();
        const keys = Object.keys(data);
        const index = keys.indexOf(key);
        const newIndex = index + direction;
        if (newIndex >= 0 && newIndex < keys.length) {
          const newKeys = [...keys];
          const temp = newKeys[newIndex];
          newKeys[newIndex] = newKeys[index];
          newKeys[index] = temp;

          const reordered = {};
          newKeys.forEach(k => {
            reordered[k] = data[k];
          });

          db.ref('posts').set(reordered);
        }
      });
    }

    function addPost() {
      const title = document.getElementById('title').value.trim();
      const link = document.getElementById('link').value.trim();
      if (!title || !link) {
        msg.style.color = 'red';
        msg.textContent = 'Both fields are required!';
        return;
      }
      const postKey = title.replace(/\s+/g, '').toLowerCase();
      db.ref('posts/' + postKey).set({ text: title, link: link })
        .then(() => {
          msg.style.color = 'green';
          msg.textContent = '✅ Link added successfully!';
          document.getElementById('title').value = '';
          document.getElementById('link').value = '';
        });
    }

    db.ref('posts').on('value', snapshot => {
      const data = snapshot.val();
      if (data) renderPosts(data);
    });
  </script></body>
</html>
