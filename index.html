<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Post Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
    }
    input, textarea {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 15px;
      margin: 2px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .green { background-color: #4CAF50; color: white; }
    .blue { background-color: #2196F3; color: white; }
    .red { background-color: #f44336; color: white; }
    .purple { background-color: #9C27B0; color: white; }
    .msg { color: green; margin: 10px 0; }
    .post-card {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Add New Post Link</h2>
    <input type="text" id="title" placeholder="Title (e.g. Post #1)">
    <textarea id="link" placeholder="Paste your full URL here..."></textarea>
    <button class="green" onclick="addPost()">Add Link</button>
    <p class="msg" id="msg"></p><h3>Search Posts</h3>
<input type="text" id="searchInput" placeholder="Search by title or link..." onkeyup="filterPosts()">

<h3>All Posts</h3>
<div id="posts"></div>

  </div>  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDeh2YAbTvupfNhEbT1uDBvoNiW1KQU9-o",
      authDomain: "trending-viral-links.firebaseapp.com",
      databaseURL: "https://trending-viral-links-default-rtdb.firebaseio.com",
      projectId: "trending-viral-links",
      storageBucket: "trending-viral-links.appspot.com",
      messagingSenderId: "803173160374",
      appId: "1:803173160374:web:fc0bb2ab64564f59ee9d17"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const postsDiv = document.getElementById('posts');
    const msg = document.getElementById('msg');

    function addPost() {
      const title = document.getElementById('title').value.trim();
      const link = document.getElementById('link').value.trim();
      if (!title || !link) {
        msg.style.color = 'red';
        msg.textContent = 'Both title and link are required!';
        return;
      }
      const post = { text: title, link };
      const postKey = Date.now();
      db.ref('posts/' + postKey).set(post).then(() => {
        msg.style.color = 'green';
        msg.textContent = '✅ Link added successfully!';
        document.getElementById('title').value = '';
        document.getElementById('link').value = '';
      });
    }

    function renderPosts(snapshot) {
      postsDiv.innerHTML = '';
      const data = snapshot.val();
      if (!data) return;
      const keys = Object.keys(data);
      keys.forEach((key, index) => {
        const { text, link } = data[key];
        const div = document.createElement('div');
        div.className = 'post-card';
        div.innerHTML = `
          <input value="${text}" id="title-${key}" />
          <textarea id="link-${key}">${link}</textarea><br><button class="blue" onclick="save('${key}')">Save</button>
      <button class="red" onclick="del('${key}')">Delete</button>
      <button class="purple" onclick="move('${key}', -1)">↑</button>
      <button class="purple" onclick="move('${key}', 1)">↓</button>
    `;
    postsDiv.appendChild(div);
  });
}

function save(key) {
  const newTitle = document.getElementById('title-' + key).value;
  const newLink = document.getElementById('link-' + key).value;
  db.ref('posts/' + key).set({ text: newTitle, link: newLink });
}

function del(key) {
  db.ref('posts/' + key).remove();
}

function move(key, direction) {
  db.ref('posts').once('value', snapshot => {
    const data = snapshot.val();
    const keys = Object.keys(data);
    const index = keys.indexOf(key);
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= keys.length) return;
    const temp = data[keys[newIndex]];
    data[keys[newIndex]] = data[key];
    data[key] = temp;
    db.ref('posts').set(data);
  });
}

function filterPosts() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  db.ref('posts').once('value', snapshot => {
    const data = snapshot.val();
    if (!data) return;
    const filtered = {};
    Object.keys(data).forEach(key => {
      if (
        data[key].text.toLowerCase().includes(query) ||
        data[key].link.toLowerCase().includes(query)
      ) {
        filtered[key] = data[key];
      }
    });
    renderPosts({ val: () => filtered });
  });
}

db.ref('posts').on('value', renderPosts);

  </script>
</body>
</html>
