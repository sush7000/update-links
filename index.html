<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Update Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      padding: 20px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-dark {
      background-color: #333;
    }
    .post-card {
      background: white;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Update Meta Content</h2>
      <button id="toggleMeta" class="btn-dark">Edit Meta</button>
      <div id="metaForm" style="display: none;">
        <input type="text" id="metaTitle" placeholder="Page Title">
        <input type="text" id="metaImage" placeholder="Image URL">
        <input type="text" id="metaTelegram" placeholder="Telegram Link">
        <button id="saveMeta">Save Meta</button>
      </div>
    </div><div class="card">
  <h2>Add New Post Link</h2>
  <input type="text" id="title" placeholder="Title (e.g. Post #1)">
  <textarea id="link" placeholder="Paste your full URL here..."></textarea>
  <button onclick="addPost()">Add Link</button>
</div>

<div class="card">
  <h2>Search Posts</h2>
  <input type="text" id="searchBox" placeholder="Search by title or link...">
</div>

<div class="card">
  <h2>All Posts</h2>
  <div id="posts"></div>
</div>

  </div>  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDeh2YAbTvupfNhEbT1uDBvoNiW1KQU9-o",
      authDomain: "trending-viral-links.firebaseapp.com",
      databaseURL: "https://trending-viral-links-default-rtdb.firebaseio.com",
      projectId: "trending-viral-links",
      storageBucket: "trending-viral-links.appspot.com",
      messagingSenderId: "803173160374",
      appId: "1:803173160374:web:fc0bb2ab64564f59ee9d17"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const metaRef = db.ref("meta");
    const postsRef = db.ref("posts");

    document.getElementById("toggleMeta").onclick = () => {
      const metaForm = document.getElementById("metaForm");
      metaForm.style.display = metaForm.style.display === "none" ? "block" : "none";
    };

    document.getElementById("saveMeta").onclick = function () {
      const title = document.getElementById("metaTitle").value.trim();
      const image = document.getElementById("metaImage").value.trim();
      const telegram = document.getElementById("metaTelegram").value.trim();

      metaRef.set({ title, image, telegram }).then(() => {
        alert("Meta saved successfully!");
      });
    };

    function addPost() {
      const title = document.getElementById('title').value.trim();
      const link = document.getElementById('link').value.trim();
      if (!title || !link) return;
      const key = title.replace(/\s+/g, '').toLowerCase();
      postsRef.child(key).set({ text: title, link: link }).then(loadPosts);
      document.getElementById('title').value = '';
      document.getElementById('link').value = '';
    }

    function loadPosts() {
      postsRef.once("value", snapshot => {
        const postsDiv = document.getElementById("posts");
        postsDiv.innerHTML = "";
        const data = snapshot.val();
        if (!data) return;
        Object.keys(data).forEach(key => {
          const post = data[key];
          const card = document.createElement("div");
          card.className = "post-card";

          const title = document.createElement("input");
          title.value = post.text;
          const link = document.createElement("textarea");
          link.value = post.link;
          const saveBtn = document.createElement("button");
          saveBtn.innerText = "Save";
          saveBtn.onclick = () => {
            postsRef.child(key).set({ text: title.value, link: link.value }).then(loadPosts);
          };
          const delBtn = document.createElement("button");
          delBtn.innerText = "Delete";
          delBtn.onclick = () => {
            postsRef.child(key).remove().then(loadPosts);
          };

          card.appendChild(title);
          card.appendChild(link);
          card.appendChild(saveBtn);
          card.appendChild(delBtn);
          postsDiv.appendChild(card);
        });
      });
    }

    document.getElementById("searchBox").addEventListener("input", function () {
      const query = this.value.toLowerCase();
      Array.from(document.getElementById("posts").children).forEach(div => {
        const text = div.innerText.toLowerCase();
        div.style.display = text.includes(query) ? "block" : "none";
      });
    });

    loadPosts();
  </script></body>
</html>
