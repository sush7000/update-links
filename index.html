<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }
    h2 {
      margin-bottom: 20px;
    }
    textarea, input[type=text] {
      width: 100%;
      max-width: 500px;
      margin-bottom: 10px;
      font-size: 16px;
      padding: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .post-box {
      background: #fff;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
    }
    .msg {
      color: green;
    }
  </style>
</head>
<body>
<h2>Edit or View Links</h2>
<div id="posts"></div>
<p class="msg" id="msg"></p><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script><script>
  const firebaseConfig = {
    apiKey: "AIzaSyDeh2YAbTvupfNhEbT1uDBvoNiW1KQU9-o",
    authDomain: "trending-viral-links.firebaseapp.com",
    databaseURL: "https://trending-viral-links-default-rtdb.firebaseio.com",
    projectId: "trending-viral-links",
    storageBucket: "trending-viral-links.appspot.com",
    messagingSenderId: "803173160374",
    appId: "1:803173160374:web:fc0bb2ab64564f59ee9d17"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const postsDiv = document.getElementById('posts');
  const msg = document.getElementById('msg');

  function loadPosts() {
    db.ref('posts').once('value').then(snapshot => {
      const data = snapshot.val();
      postsDiv.innerHTML = '';
      if (data) {
        Object.entries(data).forEach(([key, value]) => {
          const div = document.createElement('div');
          div.className = 'post-box';
          div.innerHTML = `
            <strong>${key}</strong><br>
            <input type="text" value="${value.text}" id="title_${key}" placeholder="Title"><br>
            <textarea id="link_${key}" placeholder="Link">${value.link}</textarea><br><button onclick="save('${key}')">Save</button>
      `;
      postsDiv.appendChild(div);
    });
  }
});

}

function save(id) { const newText = document.getElementById('title_' + id).value.trim(); const newLink = document.getElementById('link_' + id).value.trim();

if (!newText || !newLink) {
  msg.style.color = 'red';
  msg.textContent = 'Fields cannot be empty!';
  return;
}

db.ref('posts/' + id).set({ text: newText, link: newLink })
  .then(() => {
    msg.style.color = 'green';
    msg.textContent = '✅ Updated!';
    setTimeout(() => msg.textContent = '', 3000);
  })
  .catch(err => {
    msg.style.color = 'red';
    msg.textContent = 'Error: ' + err.message;
  });

}

loadPosts(); </script>

</body>
</html>
