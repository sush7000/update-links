<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Link Manager</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
    textarea, input { width: 100%; max-width: 500px; margin-bottom: 10px; font-size: 16px; padding: 10px; }
    button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; }
    .green { background-color: #4CAF50; color: white; }
    .blue { background-color: #2196F3; color: white; }
    .red { background-color: #f44336; color: white; }
    .purple { background-color: #9c27b0; color: white; }
    .post-box { background: #fff; padding: 10px; margin: 10px 0; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .msg { color: green; margin-top: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body><h2>Add New Post Link</h2>
<input type="text" id="title" placeholder="Title (e.g. Post #1)">
<textarea id="link" placeholder="Paste your full URL here..."></textarea>
<button class="green" onclick="addPost()">Add Link</button>
<p class="msg" id="msg"></p><h2>Search Posts</h2>
<input type="text" id="search" onkeyup="searchPosts()" placeholder="Search by title or link..."><h2>All Posts</h2>
<div id="posts"></div><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script><script>
  const firebaseConfig = {
    apiKey: "AIzaSyDeh2YAbTvupfNhEbT1uDBvoNiW1KQU9-o",
    authDomain: "trending-viral-links.firebaseapp.com",
    databaseURL: "https://trending-viral-links-default-rtdb.firebaseio.com",
    projectId: "trending-viral-links",
    storageBucket: "trending-viral-links.appspot.com",
    messagingSenderId: "803173160374",
    appId: "1:803173160374:web:fc0bb2ab64564f59ee9d17"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const postsContainer = document.getElementById('posts');
  const msg = document.getElementById('msg');

  function renderPosts(data) {
    postsContainer.innerHTML = '';
    Object.entries(data).forEach(([key, post]) => {
      const div = document.createElement('div');
      div.className = 'post-box';
      div.setAttribute('data-key', key);
      div.innerHTML = `
        <input value="${post.text}" onchange="editTitle('${key}', this.value)"><br>
        <textarea onchange="editLink('${key}', this.value)">${post.link}</textarea><p>Views: ${post.views || 0}</p>
    <button class="blue" onclick="savePost('${key}')">Save</button>
    <button class="red" onclick="deletePost('${key}')">Delete</button>
    <button class="purple" onclick="movePost('${key}', -1)">↑</button>
    <button class="purple" onclick="movePost('${key}', 1)">↓</button>
  `;
  postsContainer.appendChild(div);
});

}

function fetchPosts() { db.ref('posts').on('value', (snapshot) => { const data = snapshot.val() || {}; renderPosts(data); }); }

function addPost() { const title = document.getElementById('title').value.trim(); const link = document.getElementById('link').value.trim(); if (!title || !link) return; const postKey = title.replace(/\s+/g, '').toLowerCase(); db.ref('posts/' + postKey).set({ text: title, link: link, views: 0 }).then(() => { msg.textContent = '✅ Link added successfully!'; setTimeout(() => msg.textContent = '', 3000); document.getElementById('title').value = ''; document.getElementById('link').value = ''; }); }

function editTitle(key, newText) { db.ref('posts/' + key + '/text').set(newText); }

function editLink(key, newLink) { db.ref('posts/' + key + '/link').set(newLink); }

function savePost(key) { msg.textContent = '✅ Post updated'; setTimeout(() => msg.textContent = '', 3000); }

function deletePost(key) { db.ref('posts/' + key).remove(); }

function searchPosts() { const searchVal = document.getElementById('search').value.toLowerCase(); const boxes = document.querySelectorAll('.post-box'); boxes.forEach(box => { const text = box.querySelector('input').value.toLowerCase(); const link = box.querySelector('textarea').value.toLowerCase(); box.style.display = (text.includes(searchVal) || link.includes(searchVal)) ? '' : 'none'; }); }

function movePost(key, direction) { db.ref('posts').once('value').then(snapshot => { const data = snapshot.val(); const keys = Object.keys(data); const index = keys.indexOf(key); const newIndex = index + direction; if (newIndex < 0 || newIndex >= keys.length) return; const reordered = [...keys]; const temp = reordered[index]; reordered[index] = reordered[newIndex]; reordered[newIndex] = temp;

const newData = {};
  reordered.forEach(k => newData[k] = data[k]);
  db.ref('posts').set(newData);
});

}

fetchPosts(); </script>

</body>
</html>
